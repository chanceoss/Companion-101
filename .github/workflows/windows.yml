name: Test and build Windows app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -r requirements-integrations.txt
      - name: Test native widgets and companion behavior
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build portable Windows executable
        run: python -m PyInstaller --clean --noconfirm Biscuit.spec
      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Biscuit/Biscuit.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "Smoke test failed: $($process.ExitCode)" }
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Test packaged integration workers
        run: python scripts/check_packaged_workers.py dist/Biscuit/Biscuit.exe
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Bundle Windows app
        shell: pwsh
        run: Compress-Archive -Path dist/Biscuit -DestinationPath dist/Biscuit-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Biscuit-Windows-x64
          path: dist/Biscuit-Windows-x64.zip

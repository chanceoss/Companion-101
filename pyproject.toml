[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-101"
version = "1.0.0"
description = "Biscuit, a native animated Windows desktop companion"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6==6.8.3", "keyring==25.6.0"]

[project.optional-dependencies]
system = ["psutil>=5.9,<8"]

[project.scripts]
biscuit = "desktop_pet.app:main"

[tool.setuptools.package-data]
desktop_pet = ["assets/*.png", "assets/*.json", "assets/*.py", "assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.setuptools.packages.find]
include = ["desktop_pet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
